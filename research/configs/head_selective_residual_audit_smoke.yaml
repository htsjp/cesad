dataset: mvtec
source_dataset: visa
data_paths:
  mvtec: ./data/mvtec
  visa: ./data/VISA
source_mode: test
target_mode: test
output_dir: results/_smoke_head_selective_residual
cache_dir: cache/_smoke_head_value_phase_IV_B
device: cuda:0
seeds: [0]
resume: true
run_mode: smoke
limit: 2
batch_size: 1
num_workers: 0
image_size: 518
dpam_layer: 24
average_neighbor: true
sigma: 4
fusion_k: 0.7
topk_ratio: 0.01
compute_pixel_aupro: false
k: 4
alpha: 0.5
source_training_batches: 1
training_patches_per_image: 16
normalizer_batches: 1
max_epochs: 1
patience: 1
learning_rate: 1.0e-3
weight_decay: 1.0e-4
lambda_uniform: 1.0e-4
smoke_variants:
  - V0_UniformHeadBaseline
  - V2_StaticHeadGate
  - V4_QueryAdaptiveHeadGate
  - C1_RandomStaticWeights
  - C11_UniformGateWithMatchedTraining
baseline_reference:
  I-AUROC: 0.9419
  I-AP: 0.9711
  P-AUROC: 0.9217
  PRO: 0.8782
baseline_tolerance:
  I-AUROC: 0.002
  I-AP: 0.003
  P-AUROC: 0.002
  PRO: 0.005
fail_on_baseline_mismatch: false
n_ctx: 12
depth: 9
t_n_ctx: 4

