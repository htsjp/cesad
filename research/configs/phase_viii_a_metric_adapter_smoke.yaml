compute_pixel_aupro: false
k: 4
n_ctx: 12
depth: 9
t_n_ctx: 4
compact_rank: 8
source_val_fraction: 0.25
retrieval_temperature: 1.0
metric_ranks: [4]
metric_betas: [0.05]
metric_lr: 0.0005
metric_weight_decay: 0.0001
lambda_identity: 0.001
metric_batch_size: 128
epochs: 1
patience: 1
grad_clip: 1.0
random_control_seeds: 1
