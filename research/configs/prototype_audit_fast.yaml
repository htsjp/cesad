- name: KMeans K=4
  type: kmeans
  k: 4
- name: KMeans K=8
  type: kmeans
  k: 8
- name: FPS K=2
  type: fps
  k: 2
- name: FPS K=4
  type: fps
  k: 4
- name: FPS K=8
  type: fps
  k: 8
- name: Token memory
  type: token
- name: Statistics mean+variance
  type: statistics
n_ctx: 12
depth: 9
