data_paths:
  mvtec: ./data/mvtec
  visa: ./data/VISA
output_dir: results/_smoke_visual_memory_context
device: cuda:0
seed: 0
resume: true
run_mode: stage1
transfer_directions:
  - name: visa_to_mvtec
    source: visa
    target: mvtec
  - name: mvtec_to_visa
    source: mvtec
    target: visa
source_mode: test
target_mode: test
limit: 2
batch_size: 1
num_workers: 0
image_size: 518
dpam_layer: 24
average_neighbor: true
sigma: 4
fusion_k: 0.7
topk_ratio: 0.01
compute_pixel_aupro: false
k: 4
n_ctx: 12
depth: 9
t_n_ctx: 4
compact_rank: 8
adapter_rank: 8
alpha: 0.1
lambda_image: 1.0
lambda_preserve: 0.0001
lambda_delta: 0.00001
adapter_lr: 0.001
weight_decay: 0.0001
epochs: 1
patience: 1
grad_clip: 1.0
source_val_fraction: 0.25
control_seeds: 1
